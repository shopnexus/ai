{{- /* ai-models: the models the hub hosts itself. ai-gateway's aliases stt and
       embed-image call it, and the server calls its frames route directly;
       it has no authentication and no Ingress. */ -}}
{{- $m := .Values.models }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-models
  labels: {{- include "ai.labels" . | nindent 4 }}
  annotations: {{- include "ai.wave" "0" | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: ai-models }
  template:
    metadata:
      labels: {{- include "ai.podLabels" (dict "root" . "name" "ai-models") | nindent 8 }}
    spec:
      affinity:
        {{- include "ai.preferRole" . | nindent 8 }}
      containers:
        - name: ai-models
          image: {{ include "ai.image" .Values.images.models }}
          env:
            {{- /* env/models.env, which compose reads too, then AI_EMBED_MODELS. */}}
            {{- $shared := include "ai.envFile" (dict "root" . "file" "env/models.env") | fromJson }}
            {{- if hasKey $shared "AI_EMBED_MODELS" }}{{ fail "AI_EMBED_MODELS is set per stack in models.embedModels, not in env/models.env" }}{{ end }}
            {{- range $k, $v := $shared }}
            - { name: {{ $k }}, value: {{ $v | quote }} }
            {{- end }}
            {{- if not (kindIs "string" $m.embedModels) }}{{ fail "models.embedModels must be a string: name=dir pairs, or empty for none" }}{{ end }}
            - { name: AI_EMBED_MODELS, value: {{ $m.embedModels | quote }} }
          ports:
            - { name: http, containerPort: 8000 }
          # Loading the models takes seconds to a minute, and the server listens after it.
          startupProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 2
            failureThreshold: {{ div (required "models.startupSeconds is required" $m.startupSeconds) 2 }}
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          # Uploads wait in /tmp while they decode.
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          resources:
            requests: { cpu: "1", memory: {{ required "models.memoryRequest is required" $m.memoryRequest }} }
            limits: { memory: {{ required "models.memoryLimit is required" $m.memoryLimit }} }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ai-models
  labels: {{- include "ai.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: ai-models }
  ports:
    - { name: http, port: 8000, targetPort: http }
